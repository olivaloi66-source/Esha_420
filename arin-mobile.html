<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><title>ARIN</title>
<style>
:root{--c:255,40,40;--bg:#050607;--panel:#0d0f12;--line:#1c2026;--tx:#e8eaed;--mut:#7d8590}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,'Noto Sans Bengali',sans-serif;overflow:hidden}body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}header b{letter-spacing:.35em;font-size:15px;color:rgb(var(--c))}header span{font-size:11px;color:var(--mut)}
#tabs{display:flex;border-bottom:1px solid var(--line)}#tabs button{flex:1;background:none;border:0;color:var(--mut);padding:11px 0;font:inherit;font-size:13px;border-bottom:2px solid transparent}#tabs button.on{color:rgb(var(--c));border-bottom-color:rgb(var(--c))}
#agents{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}#agents button{flex:none;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:18px;padding:6px 11px;font:inherit;font-size:12px}#agents button.on{border-color:rgb(var(--c));box-shadow:0 0 10px rgba(var(--c),.25)}
#who{font-size:11px;color:var(--mut);padding:5px 14px 0}.view{display:none;flex:0 0 auto;flex-direction:column;align-items:center;padding:8px 12px}.view.on{display:flex}#stage{position:relative}canvas{width:180px;height:180px}#state{font-size:12px;color:var(--mut);margin-top:-6px;height:16px}#nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;padding:12px 2px 6px}.node{background:var(--panel);color:var(--tx);border:1px solid rgba(var(--c),.45);border-radius:10px;padding:9px 0;font-size:11px}
#log{flex:1;min-height:60px;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}.m{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.5;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap}.m.u{align-self:flex-end;background:rgba(var(--c),.14);border-color:rgba(var(--c),.4)}.m.e{color:#ff9b9b}
#bar{display:flex;gap:7px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}#txt{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:22px;padding:11px 14px;font:inherit;font-size:14px;outline:none;min-width:0}.btn{width:43px;height:43px;border-radius:50%;border:1px solid rgba(var(--c),.6);background:var(--panel);color:var(--tx);font-size:17px;flex:none}.btn.primary{background:rgb(var(--c));color:#000}
#sheet{position:fixed;inset:auto 0 0;max-height:72%;overflow-y:auto;background:var(--panel);border-top:1px solid rgb(var(--c));border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s;z-index:5}#sheet.open{transform:none}#sheet h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between}#sheet h3 button{background:none;border:0;color:rgb(var(--c));font:inherit}label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px;font:inherit;font-size:14px}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.go{background:rgb(var(--c));color:#000;border:0;border-radius:8px;padding:10px;font:inherit;font-weight:700}.pill{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;margin-top:6px;font-size:13px}
#toast{position:fixed;top:10px;left:10px;right:10px;z-index:9;padding:12px;border-radius:12px;background:rgb(var(--c));color:#000;font-weight:700;display:none}
@media(min-width:700px){body{max-width:520px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style></head><body>
<header><b>ARIN</b><span id="net">● অনলাইন</span></header>
<div id="tabs"><button class="on" data-tab="orb">Orb</button><button data-tab="media">Media</button><button data-tab="town">Agent Town</button></div>
<div id="toast"></div><div id="agents"></div><div id="who">আপনার সহকারী প্রস্তুত</div>
<section id="stage" class="view on"><canvas id="orb" width="460" height="460"></canvas><div id="state">প্রস্তুত</div><div id="nodes">
<button class="node" data-panel="memory">Memory</button><button class="node" data-panel="skills">Skills</button><button class="node" data-panel="expense">হিসাব</button><button class="node" data-panel="voices">Voices</button><button class="node" data-panel="settings">Settings</button></div></section>
<section id="v-media" class="view"><div class="pill">📷 Photo & Video tools</div><div class="pill">🖼️ Image upload and preview</div><div class="pill">🎬 Video tools</div><div class="pill">Media workspace is ready</div></section>
<section id="v-town" class="view"><div class="pill">🏠 Agent Town</div><div class="pill">ARIN · RONI · DIVA · ZARA · MAYA · NEXUS</div><div class="pill">এজেন্ট নির্বাচন করতে উপরের নাম চাপুন</div></section>
<div id="log"><div class="m">হ্যালো! আমি ARIN। কীভাবে সাহায্য করতে পারি?</div></div>
<div id="bar"><button class="btn" id="attach">＋</button><input id="txt" placeholder="ARIN-কে লিখুন…" autocomplete="off"><button class="btn primary" id="send">➤</button><button class="btn" id="mic" title="Voice">🎙</button></div>
<div id="sheet"></div>
<script>
const $=id=>document.getElementById(id);let agent="ARIN",token=localStorage.getItem("arin_token")||"",messages=[];
const names=["ARIN","RONI","DIVA","ZARA","MAYA","NEXUS"];
$("agents").innerHTML=names.map((n,i)=>'<button class="'+(!i?'on':'')+'" data-agent="'+n+'">'+n+'</button>').join("");
document.querySelectorAll("[data-agent]").forEach(b=>b.onclick=()=>{agent=b.dataset.agent;document.querySelectorAll("[data-agent]").forEach(x=>x.classList.toggle("on",x===b));$("who").textContent=agent+" · প্রস্তুত"});
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2500)}
function bubble(t,user=false){let d=document.createElement("div");d.className="m"+(user?" u":"");d.textContent=t;$("log").append(d);$("log").scrollTop=$("log").scrollHeight}
async function api(path,opts={}){opts.headers={...(token?{Authorization:"Bearer "+token}:{}),...(opts.headers||{})};let r=await fetch(path,opts);if(!r.ok)throw Error("সার্ভার অনুরোধ ব্যর্থ ("+r.status+")");return r.json()}
async function send(){let t=$("txt").value.trim();if(!t)return;$("txt").value="";bubble(t,true);messages.push({role:"user",text:t});$("state").textContent="ভাবছি…";try{let d=await api("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages,agent})});let answer=d.reply||d.error||"উত্তর পাওয়া যায়নি";bubble(answer);messages.push({role:"assistant",text:answer})}catch(e){bubble(e.message);toast(e.message)}finally{$("state").textContent="প্রস্তুত"}}
$("send").onclick=send;$("txt").onkeydown=e=>{if(e.key==="Enter")send()};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));$("stage").classList.toggle("on",b.dataset.tab==="orb");if(b.dataset.tab!=="orb")$("v-"+b.dataset.tab).classList.add("on")});
const panels={memory:"Memory",skills:"Skills",expense:"হিসাব",voices:"Voices",settings:"Settings"};
document.querySelectorAll("[data-panel]").forEach(b=>b.onclick=()=>openPanel(b.dataset.panel));
function openPanel(p){let title=panels[p];$("sheet").innerHTML='<h3>'+title+' <button id="close">বন্ধ ✕</button></h3><div id="panelbody"></div>';$("sheet").classList.add("open");$("close").onclick=()=>$("sheet").classList.remove("open");let body=$("panelbody");
if(p==="memory"){body.innerHTML='<label>নতুন Memory</label><textarea id="memtext" placeholder="যা মনে রাখতে হবে লিখুন"></textarea><button class="go" id="savemem" style="width:100%;margin-top:8px">Save Memory</button><div id="memitems"></div>'; $("savemem").onclick=async()=>{let text=$("memtext").value.trim();if(!text)return;try{await api("/api/memory",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});$("memtext").value="";toast("Memory saved")}catch(e){toast(e.message)}}}
else if(p==="settings"){body.innerHTML='<label>Team size</label><select id="teamsize"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select><p class="pill">ARIN AI · Settings</p>'}
else if(p==="skills"){body.innerHTML='<div class="pill">Research</div><div class="pill">Writing</div><div class="pill">Coding</div><div class="pill">Planning</div>'}
else if(p==="expense"){body.innerHTML='<label>বিবরণ</label><input id="expense" placeholder="খরচের বিবরণ"><label>পরিমাণ</label><input id="amount" type="number" placeholder="0.00"><p class="pill">হিসাবের নোট এখানে যোগ করুন</p>'}
else if(p==="voices"){body.innerHTML='<p class="pill">🎙 Voice interaction</p><p class="pill">মাইক্রোফোন অনুমতি দিলে ভয়েস ইনপুট ব্যবহার করতে পারবেন।</p>'}}
$("attach").onclick=()=>{let i=document.createElement("input");i.type="file";i.accept="image/*,video/*,.pdf,.txt";i.onchange=()=>{if(i.files[0])bubble("সংযুক্ত ফাইল: "+i.files[0].name,true)};i.click()};
$("mic").onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast("এই ব্রাউজারে Speech Recognition নেই");let r=new SR();r.lang="bn-BD";r.onresult=e=>{$("txt").value=e.results[0][0].transcript};r.onerror=()=>toast("মাইক্রোফোন ব্যবহার করা যায়নি");r.start()};
let c=$("orb"),ctx=c.getContext("2d"),pts=Array.from({length:260},()=>{let a=Math.random()*6.28,z=Math.random()*2-1,r=Math.sqrt(1-z*z);return [r*Math.cos(a),z,r*Math.sin(a)]});let tick=0;
function draw(){tick+=.008;ctx.clearRect(0,0,460,460);let col=getComputedStyle(document.documentElement).getPropertyValue("--c").trim();for(let p of pts){let x=p[0]*Math.cos(tick)-p[2]*Math.sin(tick),z=p[0]*Math.sin(tick)+p[2]*Math.cos(tick),y=p[1],k=150/(2.7+z),sx=230+x*k,sy=230+y*k;ctx.fillStyle="rgba("+col+","+(.28+(z+1)*.28)+")";ctx.beginPath();ctx.arc(sx,sy,1.2+(z+1)*.65,0,6.28);ctx.fill()}requestAnimationFrame(draw)}draw();
</script></body></html>

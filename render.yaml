services:
  - type: web
    name: arin-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /api/version
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ARIN_ADMIN_KEY
        generateValue: true
      - key: ARIN_VERSION
        value: 1.0.0
      - key: ARIN_DB_PATH
        value: /opt/render/project/src/arin.sqlite3
